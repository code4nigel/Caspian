<!DOCTYPE html><html lang="en" style=""><head>

<body class="bg-[#0a0e17] min-h-screen flex justify-center items-start text-[#dfe2f0] font-sans p-0 sm:p-6 antialiased">

<div class="w-28 h-4 bg-white/10 rounded-full mx-auto backdrop-blur-sm"></div>
<div class="flex items-center space-x-2 w-12 justify-end">

<rect height="4" rx="0.5" width="3" x="0" y="8"></rect>

</svg>
</button>

</svg>
</div>
<span class="text-[#dfe2f0] font-medium tracking-tight truncate">caspian.ai<span class="text-slate-500">/search?q=pro+workspace</span></span>
</div>

<div class="flex items-center space-x-1.5 text-slate-400 pl-1">
<svg class="w-3.5 h-3.5 stroke-[2] stroke-current fill-none" viewBox="0 0 24 24">

</div>

3
</button>
</section>

<button class="flex flex-col items-center justify-center p-3 rounded-2xl bg-[#1f2330] hover:bg-[#262a39] border border-white/10 transition-all duration-150 active:scale-95 group">

<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>

<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>

<!-- Section: Precision Action List (Rows 3-6) -->
<div class="divide-y divide-white/5 text-sm font-medium" data-purpose="omnibox-list-items">

<div class="flex items-center space-x-3 text-slate-200 group-hover:text-white">
<svg class="w-4 h-4 text-slate-400 group-hover:text-[#00daf3] transition stroke-[2] stroke-current fill-none" viewBox="0 0 24 24">
<circle cx="11" cy="11" r="8"></circle>
<path d="M21 21l-4.35-4.35" stroke-linecap="round"></path>
</svg>

14m ago

<div class="flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full bg-emerald-950/60 border border-emerald-500/40 text-emerald-400">

<span class="text-[10px] font-semibold tracking-tight">2 active</span>
</div>
</button>

<div class="w-full flex items-center justify-between py-2.5 px-1 text-left">
<div class="flex items-center space-x-3 text-slate-200">
<svg class="w-4 h-4 text-slate-400 stroke-[2] stroke-current fill-none" viewBox="0 0 24 24">
<path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" stroke-linecap="round" stroke-linejoin="round"></path>

<span class="text-xs font-medium tracking-tight">Share &amp; Export</span>
</div>

<div class="flex items-center space-x-1.5">
<button class="px-2 py-0.5 rounded-lg bg-[#262a39] hover:bg-[#313545] text-slate-200 text-[10px] font-medium border border-white/10 transition shrink-0">PDF</button>
<button class="px-2 py-0.5 rounded-lg bg-[#262a39] hover:bg-[#313545] text-slate-200 text-[10px] font-medium border border-white/10 transition shrink-0">TXT</button>

</svg>
</div>
<div>
<div class="flex items-center space-x-1.5">

</div>
</div>
<button class="px-3 py-1.5 rounded-xl bg-[#262a39] border border-white/10 text-slate-200 hover:text-white text-xs font-medium shadow-2xs hover:bg-[#313545] transition">
Settings
</button>

<div class="flex justify-center mt-3" data-purpose="sheet-dismiss-handle">

</div>
