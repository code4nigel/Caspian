<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Caspian AI Browser</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-background": "#dfe2f0",
                        "primary-container": "#00e5ff",
                        "on-tertiary-fixed-variant": "#594400",
                        "tertiary-fixed-dim": "#f3bf26",
                        "on-secondary-fixed": "#002113",
                        "outline": "#849396",
                        "tertiary-fixed": "#ffdf96",
                        "secondary-fixed-dim": "#4edea3",
                        "on-primary-container": "#00626e",
                        "on-error": "#690005",
                        "surface-container-low": "#181b25",
                        "on-secondary-container": "#00311f",
                        "on-primary-fixed-variant": "#004f58",
                        "on-surface-variant": "#bac9cc",
                        "on-primary": "#00363d",
                        "on-tertiary-fixed": "#251a00",
                        "on-primary-fixed": "#001f24",
                        "inverse-primary": "#006875",
                        "on-secondary": "#003824",
                        "on-secondary-fixed-variant": "#005236",
                        "on-error-container": "#ffdad6",
                        "surface-tint": "#00daf3",
                        "secondary-fixed": "#6ffbbe",
                        "surface": "#0f131d",
                        "primary": "#c3f5ff",
                        "outline-variant": "#3b494c",
                        "error-container": "#93000a",
                        "surface-container-highest": "#31353f",
                        "surface-dim": "#0f131d",
                        "primary-fixed-dim": "#00daf3",
                        "inverse-surface": "#dfe2f0",
                        "secondary": "#4edea3",
                        "surface-container-lowest": "#0a0e17",
                        "error": "#ffb4ab",
                        "surface-bright": "#353944",
                        "on-surface": "#dfe2f0",
                        "on-tertiary-container": "#6f5500",
                        "surface-container": "#1c1f29",
                        "inverse-on-surface": "#2d303b",
                        "tertiary-container": "#fec931",
                        "secondary-container": "#00a572",
                        "surface-variant": "#31353f",
                        "background": "#0f131d",
                        "tertiary": "#ffeac0",
                        "surface-container-high": "#262a34",
                        "on-tertiary": "#3e2e00",
                        "primary-fixed": "#9cf0ff"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "md": "16px",
                        "sm": "12px",
                        "gutter": "12px",
                        "container-margin": "20px",
                        "xl": "32px",
                        "xs": "8px",
                        "lg": "24px",
                        "base": "4px"
                    },
                    fontFamily: {
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    fontSize: {
                        "display-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
                        "headline-lg-mobile": ["28px", { lineHeight: "36px", fontWeight: "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background: linear-gradient(180deg, #050811 0%, #0a0e17 100%); /* Deep obsidian gradient */
            color: #dfe2f0;
            background-attachment: fixed;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(15, 19, 29, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .glass-pill {
            background: rgba(15, 19, 29, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.05);
        }

        .action-pod {
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2); /* Emerald glow */
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .ai-message-card {
            background: linear-gradient(180deg, rgba(0, 229, 255, 0.03) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(0, 229, 255, 0.1);
        }
        
        .user-message-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative overflow-hidden">
<!-- TopAppBar from JSON + Prompt requirements -->
<header class="h-[60px] w-full fixed top-0 z-50 flex justify-between items-center px-container-margin py-sm bg-surface-container-lowest/70 backdrop-blur-xl border-b border-primary-container/10 shadow-[0_4px_30px_rgba(0,0,0,0.1)]">
<!-- Leading Icon -->
<button class="text-on-surface-variant hover:bg-white/10 transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[20px] text-primary-container shadow-primary-container/20 drop-shadow-md" style="font-variation-settings: 'FILL' 1;">lock</span>
</button>
<!-- Centered Omnibox -->
<div class="flex-1 max-w-[320px] mx-auto h-[40px] glass-pill rounded-full flex items-center px-sm gap-2 bg-black/20">
<span class="font-body-md text-body-md text-on-surface flex-1 text-center select-all cursor-text font-medium tracking-wide">caspian.ai/chat</span>
<!-- Paste Chip -->
<div class="h-7 px-3 rounded-full bg-surface-container-high flex items-center gap-1 cursor-pointer hover:bg-primary-container/20 hover:text-primary-container transition-all border border-transparent hover:border-primary-container/30">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant group-hover:text-primary-container">content_paste</span>
</div>
</div>
<!-- Trailing Icons -->
<div class="flex items-center gap-2 text-on-surface-variant">
<button class="w-9 h-9 rounded-[10px] border border-outline-variant/50 flex items-center justify-center hover:bg-white/10 transition-colors relative hover:border-primary-container/50">
<span class="font-label-caps text-label-caps font-bold">1</span>
</button>
<button class="hover:bg-white/10 transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</button>
</div>
</header>
<!-- Main Viewport Canvas -->
<main class="flex-1 mt-[60px] mb-[120px] p-container-margin overflow-y-auto flex flex-col justify-end max-w-[700px] mx-auto w-full">
<!-- AI Chat Interface -->
<div class="flex flex-col gap-8 w-full">
<!-- User Message Placeholder (Optional Context) -->
<div class="self-end max-w-[85%] animate-fade-in-up">
<div class="user-message-card rounded-t-[24px] rounded-bl-[24px] rounded-br-[6px] p-md shadow-lg backdrop-blur-md">
<p class="font-body-md text-body-md text-on-surface">Any updates on the market today?</p>
</div>
</div>
<!-- AI Response Card -->
<div class="self-start max-w-[90%] animate-fade-in-up delay-100">
<div class="flex items-end gap-sm mb-3">
<div class="w-9 h-9 rounded-full bg-gradient-to-br from-primary-container/20 to-transparent border border-primary-container/40 flex items-center justify-center shadow-[0_0_15px_rgba(0,229,255,0.15)]">
<span class="material-symbols-outlined text-primary-container text-[20px]">auto_awesome</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant font-semibold tracking-wider">Caspian AI</span>
</div>
<div class="glass-panel ai-message-card rounded-t-[24px] rounded-br-[24px] rounded-bl-[6px] p-lg relative overflow-hidden group shadow-2xl backdrop-blur-lg">
<!-- Subtle inner glow -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-primary-container/40 to-transparent"></div>
<div class="absolute -inset-1 bg-gradient-to-r from-primary-container/10 to-[#10B981]/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500 blur-xl"></div>
<p class="font-body-lg text-body-lg text-on-surface leading-relaxed relative z-10">
                        I've analyzed the latest market trends for you. Would you like a summary of the <span class="text-[#10B981] font-semibold drop-shadow-[0_0_8px_rgba(16,185,129,0.4)]">emerald sector</span>?
                    </p>
<!-- Interactive chips -->
<div class="flex gap-sm mt-5 relative z-10">
<button class="px-md py-2 rounded-full border border-primary-container/30 bg-primary-container/5 font-body-md text-body-md text-primary-container hover:bg-primary-container/10 hover:border-primary-container/60 transition-all flex items-center gap-2 shadow-[0_0_10px_rgba(0,229,255,0.05)]">
<span class="material-symbols-outlined text-[18px]">summarize</span> Yes, summarize
                        </button>
<button class="px-md py-2 rounded-full border border-outline-variant/40 font-body-md text-body-md text-on-surface-variant hover:text-on-surface hover:bg-white/5 transition-all">
                            No thanks
                        </button>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Floating Element (Action Pod) -->
<div class="fixed bottom-[32px] left-0 right-0 z-50 flex justify-center px-container-margin pointer-events-none">
<button class="action-pod glass-panel rounded-full h-[64px] px-xl flex items-center gap-md pointer-events-auto hover:scale-[1.02] active:scale-95 transition-all duration-300 ease-out group relative overflow-hidden shadow-[0_10px_40px_rgba(16,185,129,0.15)] bg-surface-container-lowest/80">
<!-- Breathing background effect -->
<div class="absolute inset-0 bg-gradient-to-r from-[#10B981]/5 via-primary-container/5 to-[#10B981]/5 group-hover:from-[#10B981]/15 group-hover:via-primary-container/15 group-hover:to-[#10B981]/15 transition-all duration-1000 ease-in-out opacity-80"></div>
<!-- Animation Container -->
<div class="w-[48px] h-[32px] relative flex items-center justify-center opacity-90 group-hover:opacity-100 transition-opacity">

</div>
<span class="font-headline-sm text-headline-sm text-on-surface relative z-10 tracking-wide font-semibold">Ask Caspian</span>
<!-- Mic Icon indicator -->
<div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center ml-2 group-hover:bg-[#10B981]/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[22px] relative z-10 group-hover:text-[#10B981] transition-colors">mic</span>
</div>
</button>
</div>
<style>
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .animate-fade-in-up {
        animation: fadeInUp 0.5s ease-out forwards;
    }
    .delay-100 {
        animation-delay: 0.1s;
    }
</style>
</body></html>
