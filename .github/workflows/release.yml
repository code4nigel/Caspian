name: Release Multi-Platform Suite

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'Caspian-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-releases:
    name: Publish Multi-Platform Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Caspian Flow APK from Source
        run: |
          if [ -d "betaC" ]; then
            FLOW_VER=$(grep 'versionName' betaC/app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            echo "Compiling fresh Caspian Flow APK v${FLOW_VER}..."
            cd betaC
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            mkdir -p ../versions/android/flow versions
            cp app/build/outputs/apk/debug/app-debug.apk "../versions/android/flow/Caspian-Flow-v${FLOW_VER}.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "versions/Caspian-Flow-v${FLOW_VER}.apk"
            cd ..
            echo "✓ Successfully compiled and verified Caspian-Flow-v${FLOW_VER}.apk"
          fi

      - name: Package Browser Extensions
        run: python3 scripts/package_extensions.py

      - name: Publish Unified & Individual Releases via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/publish-releases.sh
          bash .github/scripts/publish-releases.sh
