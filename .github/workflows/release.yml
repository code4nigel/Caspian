name: Release Multi-Platform Suite

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  publish-releases:
    name: Publish Multi-Platform Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Extension & Standardize Assets
        run: |
          mkdir -p versions
          
          # Dynamically detect Caspian Extension version from manifest.json
          if [ -d "Caspian" ]; then
            EXT_VER=$(node -p "try { require('./Caspian/manifest.json').version } catch(e) { '6.1.5' }")
            echo "Packaging Caspian Extension v${EXT_VER}..."
            cd Caspian
            zip -r "../versions/Caspian-Extension-v${EXT_VER}.zip" ./* -x "*.git*"
            cd ..
            cp "versions/Caspian-Extension-v${EXT_VER}.zip" "./Caspian-Extension-v${EXT_VER}.zip"
          fi

          # Standardize mobile naming for collision-free clarity
          if [ -f "versions/Caspian-v1.2.40.apk" ] && [ ! -f "versions/Caspian-Mobile-v1.2.40.apk" ]; then
            cp "versions/Caspian-v1.2.40.apk" "versions/Caspian-Mobile-v1.2.40.apk"
          fi

          # Ensure Flow APKs in betaC/versions are synchronized to versions/
          if [ -d "betaC/versions" ]; then
            cp -f betaC/versions/*.apk versions/ 2>/dev/null || true
          fi

      - name: Publish Unified & Individual Releases via GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const { owner, repo } = context.repo;

            // Dynamically read extension version from Caspian/manifest.json
            let extVersion = '6.1.5';
            try {
              if (fs.existsSync('Caspian/manifest.json')) {
                const manifest = JSON.parse(fs.readFileSync('Caspian/manifest.json', 'utf8'));
                if (manifest.version) extVersion = manifest.version;
              }
            } catch (err) {
              console.log('Error reading manifest.json:', err);
            }

            // Dynamically read Flow (Beta C) version from betaC/app/build.gradle.kts
            let flowVersion = '1.1.41-BetaC';
            try {
              if (fs.existsSync('betaC/app/build.gradle.kts')) {
                const gradleContent = fs.readFileSync('betaC/app/build.gradle.kts', 'utf8');
                const match = gradleContent.match(/versionName\s*=\s*"([^"]+)"/);
                if (match && match[1]) flowVersion = match[1];
              }
            } catch (err) {
              console.log('Error reading build.gradle.kts:', err);
            }
            console.log(`Detected Flow Version: v${flowVersion}, Extension Version: v${extVersion}`);

            // Helper to recursively find release assets
            function getAssets(dir) {
              let results = [];
              if (!fs.existsSync(dir)) return results;
              const list = fs.readdirSync(dir);
              for (const file of list) {
                const fullPath = path.join(dir, file);
                const stat = fs.statSync(fullPath);
                if (stat && stat.isDirectory()) {
                  results = results.concat(getAssets(fullPath));
                } else if (file.endsWith('.apk') || file.endsWith('.zip')) {
                  results.push({ name: file, path: fullPath });
                }
              }
              return results;
            }

            const allAssets = getAssets('versions').concat(getAssets('betaC/versions'));
            console.log(`Found ${allAssets.length} total release assets.`);

            // Define the 5 primary platforms and their latest files
            const platformConfigs = [
              {
                id: 'flow',
                productName: 'Caspian Flow (Beta C)',
                tag: `Caspian-Flow-v${flowVersion}`,
                title: `[Beta C] Caspian Flow v${flowVersion}`,
                assetPattern: `Caspian-Flow-v${flowVersion}.apk`,
                isPrerelease: true,
                desc: 'Features true Multi-Profile isolated container vaults: tabs running in different casks stay logged in simultaneously without session/cookie conflicts, 1-tap Hub navigation from the header cask pill, and fixed Settings Cask modal.'
              },
              {
                id: 'mobile',
                productName: 'Caspian Mobile',
                tag: 'Caspian-Mobile-v1.2.40',
                title: '[Mobile] Caspian Mobile v1.2.40',
                assetPattern: 'Caspian-Mobile-v1.2.40.apk',
                isPrerelease: false,
                desc: 'Official stable Android mobile application for ChatGPT, Gemini, YouTube and Web pruning.'
              },
              {
                id: 'betaA',
                productName: 'Caspian Beta A',
                tag: 'Caspian-Beta-A-v1.2.48',
                title: '[Beta A] Caspian Beta A v1.2.48',
                assetPattern: 'Caspian-Beta-A-v1.2.48.apk',
                isPrerelease: true,
                desc: 'Experimental build featuring rich Gemini HTML formatter, custom SFX mapping and full-height launch.'
              },
              {
                id: 'betaB',
                productName: 'Caspian Beta B',
                tag: 'Caspian-Beta-B-v1.0.5',
                title: '[Beta B] Caspian Beta B v1.0.5',
                assetPattern: 'Caspian-Beta-B-v1.0.5.apk',
                isPrerelease: true,
                desc: 'Compact lightweight build for rapid AI browsing and split window testing.'
              },
              {
                id: 'extension',
                productName: 'Caspian Extension',
                tag: `Caspian-Extension-v${extVersion}`,
                title: `[Extension] Caspian Extension v${extVersion}`,
                assetPattern: `Caspian-Extension-v${extVersion}.zip`,
                isPrerelease: false,
                desc: 'Official Chromium Desktop Browser Extension for ChatGPT/Gemini DOM optimization, universal Flow Speed playback controller, YouTube feed limits & multi-format document exporter.'
              }
            ];

            async function uploadAsset(release, assetItem) {
              const fileData = fs.readFileSync(assetItem.path);
              const assetName = assetItem.name;
              const contentType = assetName.endsWith('.apk') 
                ? 'application/vnd.android.package-archive' 
                : 'application/zip';

              // Remove existing asset with same name if already uploaded
              if (release.assets && release.assets.length > 0) {
                const existing = release.assets.find(a => a.name === assetName);
                if (existing) {
                  console.log(`  - Deleting existing asset ${assetName} (id: ${existing.id})...`);
                  try {
                    await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
                    await new Promise(r => setTimeout(r, 2000));
                  } catch (delErr) {
                    console.log(`  - Note: asset deletion error (${delErr.message}), proceeding...`);
                  }
                }
              }

              console.log(`  - Uploading ${assetName} (${(fileData.length / 1024 / 1024).toFixed(2)} MB)...`);
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  await github.rest.repos.uploadReleaseAsset({
                    owner,
                    repo,
                    release_id: release.id,
                    name: assetName,
                    data: fileData,
                    headers: {
                      'content-type': contentType,
                      'content-length': fileData.length
                    }
                  });
                  break;
                } catch (uploadErr) {
                  console.log(`  - Upload attempt ${attempt} failed: ${uploadErr.message}`);
                  if (attempt < 3) {
                    await new Promise(r => setTimeout(r, 3000));
                  } else {
                    console.log(`  - Warning: asset upload for ${assetName} failed after 3 attempts.`);
                  }
                }
              }
            }

            const matchedLatestFiles = [];

            // 1. Publish Individual Standalone Releases
            for (const config of platformConfigs) {
              const matched = allAssets.find(a => 
                a.name === config.assetPattern || 
                a.name.includes(config.tag) ||
                (config.id === 'flow' && (a.name.toLowerCase().includes('flow') || a.name.toLowerCase().includes('betac')) && a.name.includes(flowVersion))
              );
              if (!matched) {
                console.log(`Warning: Could not find asset matching ${config.assetPattern}`);
                continue;
              }

              // Extract the latest commit message to use as the dynamic changelog
              let commitMessage = '';
              try {
                const { execSync } = require('child_process');
                commitMessage = execSync('git log -1 --pretty=%B').toString().trim();
              } catch (e) {
                console.log('Error reading commit message:', e);
              }

              const releaseNotes = (config.id === 'flow' && commitMessage) ? commitMessage : config.desc;
              const releaseBody = `### 📱 ${config.productName}\n\n${releaseNotes}\n\n- **Version Tag**: \`${config.tag}\`\n- **Artifact**: \`${matched.name}\`\n\nDownload the asset below to install or use.`;

              matchedLatestFiles.push({ config, asset: matched });
              console.log(`\n========================================`);
              console.log(`Publishing: ${config.title}`);

              let release;
              try {
                const res = await github.rest.repos.getReleaseByTag({ owner, repo, tag: config.tag });
                release = res.data;
                console.log(`Existing release found (id: ${release.id}). Updating title/body...`);
                await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.id,
                  name: config.title,
                  body: releaseBody,
                  prerelease: config.isPrerelease,
                  make_latest: "false"
                });
              } catch (e) {
                console.log(`Creating new release for ${config.tag}...`);
                const res = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: config.tag,
                  name: config.title,
                  body: releaseBody,
                  draft: false,
                  prerelease: config.isPrerelease,
                  make_latest: "false"
                });
                release = res.data;
              }

              await uploadAsset(release, matched);
              console.log(`✓ Completed release for ${config.title}`);
            }

            // 2. Publish Unified "🌟 Caspian Multi-Platform Suite (Latest)" with the "Latest" badge
            console.log(`\n========================================`);
            console.log(`Publishing Unified Latest Suite Release...`);

            const latestTag = 'Caspian-Latest-Suite';
            let suiteBody = `## 🌟 Caspian Multi-Platform Suite (Latest Releases)\n\n`;
            suiteBody += `This release bundles the **latest official builds** for all Caspian applications across Android and Desktop.\n\n`;
            suiteBody += `| Application | Latest Version | Platform | Asset Download |\n`;
            suiteBody += `| :--- | :--- | :--- | :--- |\n`;

            for (const item of matchedLatestFiles) {
              const platformType = item.asset.name.endsWith('.apk') ? 'Android APK' : 'Chromium Extension ZIP';
              suiteBody += `| **${item.config.productName}** | \`${item.config.tag}\` | ${platformType} | \`${item.asset.name}\` |\n`;
            }

            suiteBody += `\n### 📦 Direct Downloads\n`;
            suiteBody += `Click on any of the attached assets below to download the latest build for your platform.\n`;

            let suiteRelease;
            try {
              const res = await github.rest.repos.getReleaseByTag({ owner, repo, tag: latestTag });
              suiteRelease = res.data;
              console.log(`Existing Latest Suite release found (id: ${suiteRelease.id}). Updating...`);
              const updated = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: suiteRelease.id,
                name: '🌟 Caspian Multi-Platform Suite (Latest)',
                body: suiteBody,
                prerelease: false,
                make_latest: "true"
              });
              suiteRelease = updated.data;
            } catch (e) {
              console.log(`Creating new Latest Suite release...`);
              const res = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: latestTag,
                name: '🌟 Caspian Multi-Platform Suite (Latest)',
                body: suiteBody,
                draft: false,
                prerelease: false,
                make_latest: "true"
              });
              suiteRelease = res.data;
            }

            // Purge all old/obsolete assets from the Latest Suite release so only the 5 latest files exist
            if (suiteRelease.assets && suiteRelease.assets.length > 0) {
              const latestAssetNames = new Set(matchedLatestFiles.map(i => i.asset.name));
              for (const asset of suiteRelease.assets) {
                if (!latestAssetNames.has(asset.name)) {
                  console.log(`Deleting obsolete asset ${asset.name} (id: ${asset.id}) from Latest Suite...`);
                  try {
                    await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                  } catch (err) {
                    console.log(`Failed to delete asset ${asset.name}:`, err);
                  }
                }
              }
            }

            // Attach all latest assets to the unified suite release
            for (const item of matchedLatestFiles) {
              await uploadAsset(suiteRelease, item.asset);
            }

            console.log(`\n🎉 Successfully published all releases and unified Latest Suite!`);
