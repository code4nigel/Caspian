name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish All Latest APK Releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            function getApks(dir) {
              let results = [];
              if (!fs.existsSync(dir)) return results;
              const list = fs.readdirSync(dir);
              for (const file of list) {
                const fullPath = path.join(dir, file);
                const stat = fs.statSync(fullPath);
                if (stat && stat.isDirectory()) {
                  results = results.concat(getApks(fullPath));
                } else if (file.endsWith('.apk')) {
                  results.push({ name: file, path: fullPath });
                }
              }
              return results;
            }

            const apks = getApks('versions').concat(getApks('betaC/versions'));
            console.log(`Found ${apks.length} APK files in repository.`);

            const targetVersions = [
              'Caspian-Flow-v1.1.15-BetaC',
              'Caspian-Beta-A-v1.2.48',
              'Caspian-Beta-B-v1.0.5',
              'Caspian-v1.2.40',
              'Caspian-v1.0.98-Release'
            ];

            const { owner, repo } = context.repo;

            for (const tag of targetVersions) {
              const matchedApk = apks.find(a => a.name.includes(tag) || tag.includes(a.name.replace('.apk', '')));
              if (!matchedApk) {
                console.log(`No matching APK found for tag: ${tag}`);
                continue;
              }

              console.log(`\n========================================`);
              console.log(`Processing Release: ${tag}`);
              console.log(`APK Source: ${matchedApk.path}`);

              let release;
              try {
                const res = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                release = res.data;
                console.log(`Existing release found (id: ${release.id})`);
              } catch (e) {
                console.log(`Creating new release for ${tag}...`);
                const res = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  name: tag,
                  body: `### 📱 Caspian ${tag} Release\n\nOfficial release build.\n\n- **File**: \`${matchedApk.name}\`\n\nDownload the attached APK below to install on your Android device.`,
                  draft: false,
                  prerelease: tag.toLowerCase().includes('beta')
                });
                release = res.data;
                console.log(`Release created (id: ${release.id})`);
              }

              const fileData = fs.readFileSync(matchedApk.path);
              const assetName = matchedApk.name;

              if (release.assets && release.assets.length > 0) {
                const existingAsset = release.assets.find(a => a.name === assetName);
                if (existingAsset) {
                  console.log(`Deleting existing asset ${assetName} (id: ${existingAsset.id})...`);
                  await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existingAsset.id });
                }
              }

              console.log(`Uploading ${assetName} (${(fileData.length / 1024 / 1024).toFixed(2)} MB)...`);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: assetName,
                data: fileData,
                headers: {
                  'content-type': 'application/vnd.android.package-archive',
                  'content-length': fileData.length
                }
              });
              console.log(`Successfully uploaded ${assetName}!`);
            }
