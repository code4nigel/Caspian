<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Caspian PDF Study Viewer</title>
  <link rel="stylesheet" href="pdfjs/pdf_viewer.min.css">
  <link rel="stylesheet" href="pdf_viewer.css">
</head>
<body>

  <!-- =========================================================
       TOP APP BAR
       ========================================================= -->
  <header class="pdf-appbar">
    <div class="pdf-appbar-left">
      <button id="btn-pdf-whirlpool" class="icon-btn" title="Caspian Whirlpool (Circle to Search)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" stroke-dasharray="3 3"></circle>
          <path d="M12 7a5 5 0 0 1 5 5"></path>
          <path d="M7 12a5 5 0 0 1 5-5"></path>
          <circle cx="12" cy="12" r="2.5" fill="currentColor"></circle>
        </svg>
      </button>
      <div class="pdf-title-box">
        <span id="pdf-doc-title" class="pdf-doc-title">Loading PDF...</span>
        <span id="pdf-doc-sub" class="pdf-doc-sub">Caspian Study Reader</span>
      </div>
      <div id="pdf-page-chip" class="pdf-page-chip" title="Tap to jump to page">
        <span id="pdf-page-indicator">1 / 1</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </div>

    <div class="pdf-appbar-right">
      <!-- Rotate Left 90° -->
      <button id="btn-pdf-rotate-left" class="icon-btn" title="Rotate Left 90°">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 2v6h6"></path>
          <path d="M2.66 15.57a10 10 0 1 0 .57-8.38l-1.67-1.67"></path>
        </svg>
      </button>

      <!-- Rotate Right 90° -->
      <button id="btn-pdf-rotate-right" class="icon-btn" title="Rotate Right 90°">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6"></path>
          <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l1.67-1.67"></path>
        </svg>
      </button>

      <!-- Search Toggle -->
      <button id="btn-pdf-search" class="icon-btn" title="Find in Document">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <!-- Night Study Mode Toggle -->
      <button id="btn-pdf-night" class="icon-btn" title="OLED Night Study Mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <!-- Table of Contents / Outline Toggle -->
      <button id="btn-pdf-outline" class="icon-btn" title="Table of Contents">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="15" y2="12"></line>
          <line x1="3" y1="18" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- =========================================================
       IN-DOCUMENT FIND BAR (SEARCH)
       ========================================================= -->
  <div id="pdf-search-bar" class="pdf-search-bar">
    <div class="pdf-search-input-wrapper">
      <input type="text" id="pdf-search-input" class="pdf-search-input" placeholder="Search keywords..." autocomplete="off">
    </div>
    <span id="pdf-search-count" class="pdf-search-count">0 / 0</span>
    <button id="btn-search-prev" class="icon-btn" style="width: 28px; height: 28px;" title="Previous Match">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
    <button id="btn-search-next" class="icon-btn" style="width: 28px; height: 28px;" title="Next Match">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
    <button id="btn-search-close" class="icon-btn" style="width: 28px; height: 28px;" title="Close Search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- =========================================================
       MAIN PDF PAGES VIEWPORT (CONTINUOUS SCROLL)
       ========================================================= -->
  <main id="pdf-viewport">
    <div id="pdf-loading" style="text-align: center; margin-top: 60px;">
      <div class="pdf-loading-spinner"></div>
      <p style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Opening document...</p>
    </div>
  </main>

  <!-- =========================================================
       CONTEXTUAL "ASK CASPIAN AI" FLOATING LIQUID GLASS MENU
       (STRICTLY NO EMOJIS - PURE MODERN SVGs)
       ========================================================= -->
  <div id="pdf-ai-floating-menu">
    <!-- Ask Google (Google Lens & Visual Search) -->
    <button id="btn-ai-google" class="ai-menu-item google" title="Ask Google / Google Lens Visual Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke-width="3"></line>
      </svg>
      <span>Ask Google</span>
    </button>

    <!-- Ask ChatGPT -->
    <button id="btn-ai-chatgpt" class="ai-menu-item chatgpt" title="Ask ChatGPT to explain selection">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path>
      </svg>
      <span>Ask ChatGPT</span>
    </button>

    <!-- Ask Gemini -->
    <button id="btn-ai-gemini" class="ai-menu-item gemini" title="Ask Gemini to explain selection">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"></path>
      </svg>
      <span>Ask Gemini</span>
    </button>

    <div class="ai-menu-divider"></div>

    <!-- Split Screen Arena -->
    <button id="btn-ai-split" class="ai-menu-item split" title="Open Split Screen with AI">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <line x1="12" y1="3" x2="12" y2="21"></line>
      </svg>
      <span>Split Arena</span>
    </button>

    <!-- Copy to Clipboard -->
    <button id="btn-ai-copy" class="ai-menu-item copy" title="Copy text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <rect x="9" y="9" width="13" height="13" rx="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
  </div>

  <!-- =========================================================
       BOTTOM FLOATING ZOOM & ERGONOMIC DOCK
       ========================================================= -->
  <div class="pdf-bottom-dock">
    <button id="btn-zoom-out" title="Zoom Out">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
    <span id="pdf-zoom-label" class="pdf-zoom-label">100%</span>
    <button id="btn-zoom-in" title="Zoom In">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
    <button id="btn-fit-width" title="Fit to Screen Width">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <polyline points="4 14 10 14 10 20"></polyline>
        <polyline points="20 10 14 10 14 4"></polyline>
        <line x1="14" y1="10" x2="21" y2="3"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    </button>
  </div>

  <!-- =========================================================
       TABLE OF CONTENTS / OUTLINE DRAWER
       ========================================================= -->
  <aside id="pdf-outline-drawer" class="pdf-outline-drawer">
    <div class="pdf-outline-header">
      <span class="pdf-outline-title">Table of Contents</span>
      <button id="btn-outline-close" class="icon-btn" style="width: 28px; height: 28px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="pdf-outline-list" class="pdf-outline-list">
      <!-- Outline items rendered via JS -->
    </div>
  </aside>

  <!-- =========================================================
       PAGE JUMP MODAL DIALOG
       ========================================================= -->
  <div id="pdf-jump-modal" class="pdf-modal-backdrop">
    <div class="pdf-modal-card">
      <div class="pdf-modal-title">Jump to Page</div>
      <input type="number" id="pdf-jump-input" class="pdf-page-input" min="1" max="1" placeholder="Page #">
      <div class="pdf-modal-actions">
        <button id="btn-jump-cancel" class="pdf-modal-btn secondary">Cancel</button>
        <button id="btn-jump-confirm" class="pdf-modal-btn primary">Go</button>
      </div>
    </div>
  </div>

  <!-- PDF.js Engine & Viewer Logic -->
  <script src="pdfjs/pdf.min.js"></script>
  <script src="pdf_viewer.js"></script>
</body>
</html>
